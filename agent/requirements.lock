# The exact set of packages for the agent image, with hashes. Optional.
#
# While this file holds comments only, the image build installs
# requirements.txt, at whatever versions are current. Once it names packages,
# the build installs exactly these and nothing else (pip --require-hashes):
# every package pinned with "==", every file checked against its hash, the
# packages those packages need included.
#
# One way to write it is pip-tools, which is not part of this kit. Run it with
# the Python version of the base image (3.12), from this directory:
#
#   pip-compile --generate-hashes --output-file requirements.lock requirements.txt
#
# pip-compile overwrites the file, these comments included. Lines look like:
#
#   google-adk==<version> \
#       --hash=sha256:<hash of each file of that version>
